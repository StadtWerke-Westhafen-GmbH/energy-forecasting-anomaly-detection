<!-- @dsCard group="Colors" viewport="700x200" name="Datenrollen" subtitle="Feste Zuordnung in Dashboard, Notebook und Folie" -->
<!doctype html><html lang="de"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card)}.l{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;align-items:center}.n{font:var(--text-label);color:var(--text-primary)}.d{display:flex;align-items:center;gap:10px}.d code{font:var(--text-data);font-size:var(--fs-2xs);color:var(--text-muted)}</style></head><body><div class="l">
<span class="n">Ist</span><div class="d"><svg width="120" height="12"><line x1="0" y1="6" x2="120" y2="6" stroke="var(--data-actual)" stroke-width="2"/></svg><code>--data-actual · navy, durchgezogen</code></div>
<span class="n">Prognose</span><div class="d"><svg width="120" height="12"><line x1="0" y1="6" x2="120" y2="6" stroke="var(--data-forecast)" stroke-width="2" stroke-dasharray="4 2"/></svg><code>--data-forecast · cyan, gestrichelt 4 2</code></div>
<span class="n">Konfidenzband</span><div class="d"><span style="display:block;width:120px;height:12px;background:var(--data-band);border-radius:2px"></span><code>--data-band · cyan 16 %</code></div>
<span class="n">Residuum</span><div class="d"><svg width="120" height="12"><line x1="0" y1="6" x2="120" y2="6" stroke="var(--data-residual)" stroke-width="2"/></svg><code>--data-residual · teal</code></div>
<span class="n">Schwellwert</span><div class="d"><svg width="120" height="12"><line x1="0" y1="6" x2="120" y2="6" stroke="var(--data-threshold)" stroke-width="1" stroke-dasharray="3 3"/></svg><code>--data-threshold · amber, gepunktet</code></div>
<span class="n">Anomalie</span><div class="d"><svg width="120" height="12"><circle cx="60" cy="6" r="4.5" fill="var(--data-anomaly)" stroke="#fff" stroke-width="1.5"/></svg><code>--data-anomaly · rot, gefüllter Marker</code></div>
</div></body></html>
