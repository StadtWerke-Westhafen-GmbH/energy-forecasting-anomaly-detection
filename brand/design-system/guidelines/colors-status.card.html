<!-- @dsCard group="Colors" viewport="700x170" name="Statusfarben" subtitle="Geprüft · Hinweis · Auffällig · Kritisch — Farbe + Wort, nie Farbe allein" -->
<!doctype html><html lang="de"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{border:1px solid;border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;gap:6px}.c b{font:var(--text-label)}.c code{font:var(--text-data);font-size:var(--fs-3xs);opacity:.8}.c i{height:6px;border-radius:3px;display:block}</style></head><body><div class="g">
<div class="c" style="background:var(--status-ok-bg);border-color:var(--status-ok-border);color:var(--green-700)"><i style="background:var(--status-ok)"></i><b>Geprüft</b><code>--status-ok<br>var(--green-600) / bg var(--green-100)</code></div>
<div class="c" style="background:var(--status-info-bg);border-color:var(--status-info-border);color:var(--teal-700)"><i style="background:var(--status-info)"></i><b>Hinweis</b><code>--status-info<br>var(--teal-600) / bg var(--teal-100)</code></div>
<div class="c" style="background:var(--status-warn-bg);border-color:var(--status-warn-border);color:var(--amber-700)"><i style="background:var(--status-warn)"></i><b>Auffällig</b><code>--status-warn<br>var(--amber-600) / bg var(--amber-100)</code></div>
<div class="c" style="background:var(--status-critical-bg);border-color:var(--status-critical-border);color:var(--red-600)"><i style="background:var(--status-critical)"></i><b>Kritisch</b><code>--status-critical<br>var(--red-500) / bg var(--red-100)</code></div>
</div></body></html>
