<!-- @dsCard group="Brand" viewport="700x170" name="Zustände" subtitle="Hover dunkelt eine Rampenstufe · Press eine weitere · Focus 3 px Teal · kein Skalieren" -->
<!doctype html><html lang="de"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card)}code{font:var(--text-data);font-size:var(--fs-2xs);color:var(--text-muted)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.i{display:flex;flex-direction:column;gap:8px;align-items:center}.b{width:100%;height:36px;border-radius:var(--radius-md);display:grid;place-items:center;font:var(--text-label);color:#fff;background:var(--navy-700)}.i em{font:var(--text-data);font-size:var(--fs-3xs);color:var(--text-muted);font-style:normal}</style></head><body><div class="g">
<div class="i"><div class="b">Default</div><em>navy-700</em></div>
<div class="i"><div class="b" style="background:var(--navy-800)">Hover</div><em>navy-800</em></div>
<div class="i"><div class="b" style="background:var(--navy-900)">Press</div><em>navy-900</em></div>
<div class="i"><div class="b" style="box-shadow:var(--focus-ring)">Focus</div><em>--focus-ring</em></div>
<div class="i"><div class="b" style="background:var(--grey-50);color:var(--text-disabled);border:1px solid var(--border-subtle)">Disabled</div><em>grey-50 / kein Opacity</em></div></div></body></html>
