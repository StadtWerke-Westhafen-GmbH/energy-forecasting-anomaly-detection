<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Energie-Dashboard" description="Dashboard-Screen im SWW-Design: Navy-Sidebar, Topbar, KPI-Reihe, Prognose-Chart und Anomalie-Tabelle." -->
<helmet><script src="./ds-base.js"></script>
<style>body{margin:0;background:#F1F4F7}#root,.app{min-height:100vh}</style></helmet>
<div class="app" style="display:flex;min-height:100vh;font-family:'IBM Plex Sans',Segoe UI,sans-serif;color:#141A21">

<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.SidebarNav" items="{{ navItems }}" value="{{ screen }}" onChange="{{ setScreen }}" logoSrc="../../assets/logo-sww-wordmark.png" markSrc="../../assets/logo-sww-emblem.png" footer="{{ navFooter }}" hint-size="236px,100vh" style="flex:none"></x-import>

<div style="flex:1;min-width:0;display:flex;flex-direction:column">

<header style="height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;background:#fff;border-bottom:1px solid #D2DAE2">
<span style="font-size:16px;font-weight:600">Übersicht</span>
<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.Badge" status="neutral" size="sm" icon="calendar" hint-size="90px,22px">03/2025</x-import>
<div style="margin-left:auto;display:flex;align-items:center;gap:12px">
<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.IconButton" icon="search" label="Zähler suchen" hint-size="36px,36px"></x-import>
<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.IconButton" icon="bell" label="Benachrichtigungen" hint-size="36px,36px"></x-import>
<span style="width:1px;height:24px;background:#D2DAE2"></span>
<span style="width:28px;height:28px;border-radius:50%;background:#E4EFF7;color:#063659;display:grid;place-items:center;font-size:12px;font-weight:500">HM</span>
<span style="font-size:12px;color:#4E5A68">Henrik Maaß</span>
</div>
</header>

<main style="flex:1;overflow:auto;padding:24px 24px 40px">
<div style="max-width:1440px;margin:0 auto">

<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.PageHeader" eyebrow="Betrieb" title="Portfolio-Übersicht 03/2025" subtitle="Monatsverbrauch von 700 Zählern, Prognose zum Monatsbeginn gegen realisierten Verbrauch." meta="{{ headerMeta }}" actions="{{ headerActions }}" hint-size="100%,140px"></x-import>

<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px">
<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.KpiTile" label="Prognose 04/2025" value="14.820" unit="MWh" delta="+2,1 %" reference="vs. Ist 03/2025" icon="trending-up" spark="{{ sparkIst }}" hint-size="100%,120px"></x-import>
<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.KpiTile" label="Ist 03/2025" value="14.514" unit="MWh" delta="−1,3 %" reference="vs. 02/2025" icon="zap" hint-size="100%,120px"></x-import>
<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.KpiTile" label="Prognosegüte Test 2025" value="R² 0,912" reference="MAE 4.180 kWh · RMSE 7.940 kWh" icon="activity" hint-size="100%,120px"></x-import>
<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.KpiTile" variant="accent" label="Offene Anomalien" value="128" delta="+18" deltaTone="bad" reference="vs. 02/2025" icon="triangle-alert" spark="{{ sparkAnomalien }}" hint-size="100%,120px"></x-import>
</div>

<div style="display:grid;grid-template-columns:1.9fr 1fr;gap:16px;margin-bottom:16px">
<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.Card" title="Prognose vs. Ist — Portfolio" subtitle="24 Monate, Verbrauch in MWh" icon="trending-up" footer="Training 2024 · Test 2025 (zeitlicher Split) · Random-Forest-Regressor v2.3" hint-size="100%,360px">
<div ref="{{ chartRef }}" style="width:100%;height:272px"></div>
</x-import>
<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.Card" title="Anomalien nach Kundentyp" subtitle="03/2025" icon="chart-column" footer="Schwellwert: 95. Perzentil der absoluten Abweichung" hint-size="100%,360px">
<div ref="{{ barRef }}" style="width:100%;height:272px"></div>
</x-import>
</div>

<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.Alert" status="neutral" icon="info" hint-size="100%,52px" style="margin-bottom:16px">Das Modell ersetzt keine Abrechnungsentscheidung — es flaggt nur Untersuchungswürdiges.</x-import>

<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.Card" title="Größte Abweichungen" subtitle="Top 6 nach absoluter prozentualer Abweichung, 03/2025" icon="triangle-alert" flush="{{ true }}" actions="{{ tableActions }}" hint-size="100%,340px">
<x-import component-from-global-scope="StadtWerkeWesthafenDesignSystem_acd94c.DataTable" rowKey="zaehler_id" columns="{{ columns }}" rows="{{ rows }}" selectedKey="{{ selected }}" onRowClick="{{ selectRow }}" hint-size="100%,300px"></x-import>
</x-import>

</div>
</main>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  chartRef = React.createRef();
  barRef = React.createRef();
  state = { screen: "uebersicht", selected: "ZW-04412" };

  componentDidMount() {
    if (window.Plotly) return this.draw();
    const existing = document.getElementById("sww-plotly");
    if (existing) return existing.addEventListener("load", () => this.draw());
    const s = document.createElement("script");
    s.id = "sww-plotly";
    s.src = "https://cdn.plot.ly/plotly-2.35.2.min.js";
    s.onload = () => this.draw();
    document.head.appendChild(s);
  }

  months() {
    const M = [];
    for (let y = 2024; y <= 2025; y++) for (let m = 1; m <= 12; m++) M.push(String(m).padStart(2, "0") + "/" + y);
    return M;
  }

  series() {
    let s = 11;
    const r = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
    const ist = this.months().map((_, i) => Math.round(14500 * (1 + 0.14 * Math.cos(((i % 12) / 12) * 2 * Math.PI)) * (1 + (r() - 0.5) * 0.05)));
    const pr = ist.map((v) => Math.round(v * (1 + (r() - 0.5) * 0.045)));
    return { ist: ist, pr: pr, lo: pr.map((v) => Math.round(v * 0.955)), hi: pr.map((v) => Math.round(v * 1.045)) };
  }

  base() {
    return {
      font: { family: "IBM Plex Sans, sans-serif", size: 12, color: "#141A21" },
      paper_bgcolor: "#fff", plot_bgcolor: "#fff", separators: ",.",
      hovermode: "x unified",
      hoverlabel: { bgcolor: "#fff", bordercolor: "#E4E9EF", font: { family: "IBM Plex Sans, sans-serif", size: 12, color: "#141A21" } },
      legend: { orientation: "h", y: 1.04, x: 0, font: { size: 12, color: "#6B7887" } },
      xaxis: { showgrid: false, showline: true, linecolor: "#E4E9EF", ticks: "outside", tickcolor: "#E4E9EF", dtick: 3, tickfont: { family: "IBM Plex Sans, sans-serif", size: 11, color: "#6B7887" } },
      yaxis: { showgrid: true, gridcolor: "#E4E9EF", showline: false, tickformat: ",d", separatethousands: true, tickfont: { family: "IBM Plex Sans, sans-serif", size: 11, color: "#6B7887" } },
      bargap: 0.36, barcornerradius: 4,
    };
  }

  draw() {
    if (!window.Plotly) return;
    const M = this.months();
    const S = this.series();
    if (this.chartRef.current) {
      const l = this.base();
      l.height = 272;
      l.margin = { l: 66, r: 18, t: 30, b: 42 };
      l.yaxis = Object.assign({}, l.yaxis, { title: { text: "Verbrauch (MWh)", font: { size: 12, color: "#6B7887" } } });
      window.Plotly.newPlot(this.chartRef.current, [
        { x: M.concat(M.slice().reverse()), y: S.hi.concat(S.lo.slice().reverse()), fill: "toself", fillcolor: "rgba(0,144,200,0.16)", line: { width: 0 }, hoverinfo: "skip", name: "Konfidenzband", type: "scatter" },
        { x: M, y: S.ist, name: "Ist", mode: "lines+markers", type: "scatter", line: { color: "#084878", width: 2 }, marker: { size: 5, color: "#084878" } },
        { x: M, y: S.pr, name: "Prognose", mode: "lines", type: "scatter", line: { color: "#0090C8", width: 2, dash: "4,2" } },
      ], l, { displayModeBar: false, responsive: true });
    }
    if (this.barRef.current) {
      const l = this.base();
      l.height = 272;
      l.margin = { l: 44, r: 12, t: 12, b: 40 };
      l.showlegend = false;
      l.hovermode = "closest";
      l.yaxis = Object.assign({}, l.yaxis, { title: { text: "Zähler", font: { size: 12, color: "#6B7887" } } });
      l.xaxis = Object.assign({}, l.xaxis, { dtick: 1, tickfont: { family: "IBM Plex Sans, sans-serif", size: 12, color: "#4E5A68" } });
      window.Plotly.newPlot(this.barRef.current, [{
        type: "bar", x: ["Gewerbe", "Industrie", "Kommunal"], y: [47, 58, 23],
        marker: { color: ["#0080A0", "#084878", "#58A858"] },
        text: [47, 58, 23], textposition: "outside",
        textfont: { family: "IBM Plex Sans, sans-serif", size: 12, color: "#4E5A68" },
      }], l, { displayModeBar: false, responsive: true });
    }
  }

  rows() {
    return [
      { zaehler_id: "ZW-05316", kunde: "Klinikum Westhafen", kundentyp: "Industrie", prognose: "912.400", ist: "1.291.900", abw: "+41,6 %", sev: "critical", sevLabel: "Kritisch" },
      { zaehler_id: "ZW-04412", kunde: "Hafenterminal Nord", kundentyp: "Industrie", prognose: "928.700", ist: "1.284.500", abw: "+38,2 %", sev: "critical", sevLabel: "Kritisch" },
      { zaehler_id: "ZW-02044", kunde: "Rechenzentrum Kai", kundentyp: "Gewerbe", prognose: "268.300", ist: "173.700", abw: "−35,2 %", sev: "critical", sevLabel: "Kritisch" },
      { zaehler_id: "ZW-05540", kunde: "Containerlager 7", kundentyp: "Gewerbe", prognose: "204.100", ist: "268.800", abw: "+31,7 %", sev: "critical", sevLabel: "Kritisch" },
      { zaehler_id: "ZW-04087", kunde: "Pumpwerk Ost", kundentyp: "Kommunal", prognose: "94.600", ist: "67.700", abw: "−28,4 %", sev: "warn", sevLabel: "Auffällig" },
      { zaehler_id: "ZW-00578", kunde: "Kfz-Zentrum Hafen", kundentyp: "Gewerbe", prognose: "198.400", ist: "251.800", abw: "+26,9 %", sev: "warn", sevLabel: "Auffällig" },
    ];
  }

  renderVals() {
    const NS = window.StadtWerkeWesthafenDesignSystem_acd94c || {};
    const { Tag, StatusDot, Button, Badge, KUNDENTYP_COLOR } = NS;
    const e = React.createElement;
    const severe = (v) => (v.indexOf("+4") === 0 || v.indexOf("+3") === 0 || v.indexOf("−3") === 0 ? "#951C15" : "#7F4C03");

    return {
      screen: this.state.screen,
      selected: this.state.selected,
      setScreen: (id) => this.setState({ screen: id }),
      selectRow: (r) => this.setState({ selected: r.zaehler_id }),
      chartRef: this.chartRef,
      barRef: this.barRef,
      sparkIst: [12.6, 13.1, 13.4, 13.9, 14.2, 13.8, 13.4, 13.5, 14.0, 14.4, 14.8, 14.5],
      sparkAnomalien: [64, 71, 58, 66, 74, 69, 81, 77, 88, 95, 112, 128],
      navItems: [
        { id: "uebersicht", label: "Übersicht", icon: "layout-dashboard", group: "Betrieb" },
        { id: "anomalien", label: "Anomalien", icon: "triangle-alert", group: "Betrieb", count: 128, alert: true },
        { id: "zaehler", label: "Zähler-Detail", icon: "gauge", group: "Betrieb" },
        { id: "beschaffung", label: "Beschaffung", icon: "shopping-cart", group: "Planung" },
        { id: "qualitaet", label: "Datenqualität", icon: "database", group: "Planung" },
      ],
      navFooter: e("span", null, "Modell v2.3 · Random-Forest-Regressor", e("br"), "Stand 01.04.2025, 06:00"),
      headerMeta: e(React.Fragment, null,
        e("span", null, "700 Zähler"), e("span", null, "·"),
        e("span", null, "Mittel- und Niederspannung"), e("span", null, "·"),
        e("span", null, "Stand 01.04.2025, 06:00")),
      headerActions: Button ? e(React.Fragment, null,
        e(Button, { variant: "secondary", icon: "download" }, "Export"),
        e(Button, { variant: "primary", icon: "trending-up" }, "Prognose 04/2025")) : null,
      tableActions: Badge ? e(Badge, { status: "critical", size: "sm" }, "14 kritisch") : null,
      rows: this.rows(),
      columns: [
        { key: "zaehler_id", label: "Zähler", mono: true, width: 110 },
        { key: "kunde", label: "Kunde" },
        { key: "kundentyp", label: "Kundentyp", width: 150, render: (r) => (Tag ? e(Tag, { dotColor: KUNDENTYP_COLOR[r.kundentyp] }, r.kundentyp) : r.kundentyp) },
        { key: "prognose", label: "Prognose (kWh)", numeric: true },
        { key: "ist", label: "Ist (kWh)", numeric: true },
        { key: "abw", label: "Abweichung", numeric: true, render: (r) => e("span", { style: { fontWeight: 600, color: severe(r.abw) } }, r.abw) },
        { key: "sev", label: "Status", width: 140, render: (r) => (StatusDot ? e(StatusDot, { status: r.sev, label: r.sevLabel }) : r.sevLabel) },
      ],
    };
  }
}

</script>
</body>
</html>
