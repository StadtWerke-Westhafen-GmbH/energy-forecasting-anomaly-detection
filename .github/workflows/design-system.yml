name: Design system
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install uv==0.11.13
      - run: python -m uv sync --frozen --all-extras
      - run: npm ci
      - run: python -m uv run --frozen python scripts/build_tokens.py --check
      - run: npm run build
      - run: python -m uv run --frozen python scripts/build_templates.py
      - run: python -m uv run --frozen ruff check src/energy_analytics scripts tests
      - run: python -m uv run --frozen pytest -q
      - run: npx playwright install --with-deps chromium
      - name: Browser checks (external requests blocked)
        run: |
          npm run preview &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm test
