[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "westhafen-energy-analytics"
version = "0.1.0"
description = "Shared SWW visualisation tools for energy forecasting and anomaly detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "plotly>=6.5,<7", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6,<8",
    "jinja2>=3.1,<4",
    "nbformat>=5.10,<6",
    "pandas>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "scipy>=1.13,<2",
]
export = ["kaleido>=1.2,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "python-pptx>=1.0,<2", "python-docx>=1.2,<2", "fonttools[woff]>=4.61,<5", "ruff>=0.14,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"energy_analytics.visualization" = ["*.json", "*.mplstyle", "fonts/*.ttf", "fonts/*-LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
