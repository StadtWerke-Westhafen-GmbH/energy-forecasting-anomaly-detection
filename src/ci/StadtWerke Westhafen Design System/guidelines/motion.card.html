<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="120 / 180 / 260 ms · cubic-bezier(.2,0,.2,1) · kein Bounce, kein Overshoot" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card)}code{font:var(--text-data);font-size:var(--fs-2xs);color:var(--text-muted)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.i{border:1px solid var(--border-default);border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;gap:8px}.i b{font:var(--text-label)}.bar{height:6px;background:var(--grey-100);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal-500);width:40%;animation:m 2.4s var(--ease-standard) infinite}@keyframes m{0%{width:8%}50%{width:100%}100%{width:8%}}</style></head><body><div class="g">
<div class="i"><b>fast 120 ms</b><div class="bar"><i></i></div><code>Controls, Hover</code></div>
<div class="i"><b>base 180 ms</b><div class="bar"><i style="animation-duration:3s"></i></div><code>Panels, Modal</code></div>
<div class="i"><b>slow 260 ms</b><div class="bar"><i style="animation-duration:3.6s"></i></div><code>Screenwechsel</code></div>
<div class="i"><b>chart 420 ms</b><div class="bar"><i style="animation-duration:4.2s;background:var(--cyan-500)"></i></div><code>Erst-Zeichnung, einmalig</code></div></div></body></html>
