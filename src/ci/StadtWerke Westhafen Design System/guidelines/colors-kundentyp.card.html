<!-- @dsCard group="Colors" viewport="700x150" name="Kundentyp-Mapping" subtitle="Gewerbe · Industrie · Kommunal — identisch in charts.css und sww_theme.py" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 18px;background:var(--surface-card)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.c{border:1px solid var(--border-default);border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;gap:8px}.c i{height:28px;border-radius:var(--radius-sm)}.c b{font:var(--text-label)}.c code{font:var(--text-data);font-size:var(--fs-2xs);color:var(--text-muted)}</style></head><body><div class="g">
<div class="c"><i style="background:var(--chart-gewerbe)"></i><b>Gewerbe</b><code>--chart-gewerbe #0080A0</code></div>
<div class="c"><i style="background:var(--chart-industrie)"></i><b>Industrie</b><code>--chart-industrie #084878</code></div>
<div class="c"><i style="background:var(--chart-kommunal)"></i><b>Kommunal</b><code>--chart-kommunal #58A858</code></div>
</div></body></html>
