<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="slide.css"><script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script></head><body><div class="slide"><header class="slide__hd"><div><p class="eyebrow">Kapitel 3 · Modellierung</p><h2 class="h2">Prognose folgt dem Ist — Abweichungen bleiben saisonal</h2></div></header>
<div class="slide__bd"><div id="c" style="width:100%;height:400px"></div>
<p class="body" style="font-size:20px;margin-top:-8px">Größte Restfehler in den saisonalen Übergängen März/April und September/Oktober. Ist navy, Prognose cyan gestrichelt, Konfidenzband cyan 16 %.</p></div><footer class="slide__ft"><img class="logo-sm" src="../assets/logo-sww-wordmark.png" alt="StadtWerke Westhafen GmbH"><span>Verbrauchsprognose &amp; Frühwarnung</span><span class="sp">16 / 24</span></footer></div>
<script>
const M=[];for(let y=2024;y<=2025;y++)for(let m=1;m<=12;m++)M.push(String(m).padStart(2,"0")+"/"+y);
let s=7;const r=()=>(s=(s*1103515245+12345)%2147483648)/2147483648;
const ist=M.map((_,i)=>Math.round(14500*(1+0.14*Math.cos((i%12)/12*2*Math.PI))*(1+(r()-0.5)*0.05)));
const pr=ist.map(v=>Math.round(v*(1+(r()-0.5)*0.05)));
const lo=pr.map(v=>Math.round(v*0.955)),hi=pr.map(v=>Math.round(v*1.045));
Plotly.newPlot("c",[
{x:M.concat(M.slice().reverse()),y:hi.concat(lo.slice().reverse()),fill:"toself",fillcolor:"rgba(0,144,200,0.16)",line:{width:0},hoverinfo:"skip",name:"Konfidenzband",type:"scatter"},
{x:M,y:ist,name:"Ist",mode:"lines+markers",type:"scatter",line:{color:"#084878",width:3},marker:{size:7,color:"#084878"}},
{x:M,y:pr,name:"Prognose",mode:"lines",type:"scatter",line:{color:"#0090C8",width:3,dash:"4,2"}}],
{font:{family:"IBM Plex Sans, sans-serif",size:17,color:"#141A21"},paper_bgcolor:"#fff",plot_bgcolor:"#fff",separators:",.",
margin:{l:96,r:24,t:44,b:60},legend:{orientation:"h",y:1.06,x:0,font:{size:17,color:"#6B7887"}},
xaxis:{showgrid:false,showline:true,linecolor:"#E4E9EF",ticks:"outside",tickcolor:"#E4E9EF",tickfont:{size:15,color:"#6B7887"},dtick:3},
yaxis:{showgrid:true,gridcolor:"#E4E9EF",showline:false,tickformat:",d",separatethousands:true,title:{text:"Verbrauch (MWh)",font:{size:17,color:"#6B7887"}},tickfont:{size:15,color:"#6B7887"}}},
{displayModeBar:false,staticPlot:true});
</script></body></html>
